services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rahmet_shared
      POSTGRES_USER: rahmet
      POSTGRES_PASSWORD: rahmet_local_only
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rahmet -d rahmet_shared"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - rahmet_pg_data:/var/lib/postgresql/data

volumes:
  rahmet_pg_data:
